name: Release firmware

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: espressif/idf:v6.0.2

    env:
      IDF_PATH: /opt/esp/idf

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      # actions/checkout marks the workspace safe in a *temporary* HOME on the
      # runner, which the git inside this container never sees: it runs as a
      # different user, so every git call fails with "detected dubious
      # ownership". ESP-IDF silently falls back to PROJECT_VER=1 when its
      # `git describe` fails, which makes the firmware report version "1" and
      # the OTA update check offer an update forever. Re-declare it here so the
      # container's git trusts the checkout and its submodules.
      - name: Trust checkout inside the build container
        run: git config --global --add safe.directory '*'

      - name: Build Dependency (ot_rcp)
        run: |
          . $IDF_PATH/export.sh
          cd $IDF_PATH/examples/openthread/ot_rcp
          idf.py set-target esp32h2
          idf.py build

      - name: Build Main S20-OTBR Application
        run: |
          . $IDF_PATH/export.sh
          cd s20-otbr
          idf.py build

      # ESP-IDF falls back to PROJECT_VER=1 whenever `git describe` fails, and
      # only reports it as a STATUS line, so the build stays green while the
      # firmware ships an unusable version. Fail loudly instead.
      - name: Verify firmware version matches the release tag
        run: |
          TAG_NAME=${{ github.event.release.tag_name || github.ref_name }}
          VERSION=$(python -c "import json; print(json.load(open('s20-otbr/build/project_description.json'))['project_version'])")
          echo "PROJECT_VER=$VERSION, tag=$TAG_NAME"
          if [ "$VERSION" != "$TAG_NAME" ]; then
            echo "::error::Firmware reports version '$VERSION' instead of '$TAG_NAME'. The OTA update check compares this against the latest release tag, so a mismatch makes every device offer an update forever."
            exit 1
          fi

      - name: Combine binaries
        run: |
          . $IDF_PATH/export.sh
          cd s20-otbr/build
          python -m esptool \
            --chip esp32s3 \
            merge_bin \
            -o combined.bin \
            "@flash_args"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: esp32s3-otbr-firmware
          path: |
            s20-otbr/build/ota_with_rcp_image
            s20-otbr/build/combined.bin
            s20-otbr/build/s20_otbr.bin
            s20-otbr/build/web_storage.bin
            s20-otbr/build/rcp_fw.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: esp32s3-otbr-firmware
          path: ./artifacts

      - name: Create/Update GitHub Release with Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.event.release.tag_name || github.ref_name }}

          # Ensure the release exists (tolerate a concurrent run creating it first).
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release for tag: $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes || true
          fi

          echo "Uploading assets to release: $TAG_NAME"
          gh release upload "$TAG_NAME" \
            ./artifacts/ota_with_rcp_image \
            ./artifacts/combined.bin \
            ./artifacts/s20_otbr.bin \
            ./artifacts/web_storage.bin \
            ./artifacts/rcp_fw.bin \
            --clobber
