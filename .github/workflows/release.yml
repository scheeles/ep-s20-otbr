name: Release firmware

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Reuses the same build definition as PR CI, so a green PR is real evidence
  # that the release will build. verify_tag additionally fails the build if the
  # firmware would not report the release tag as its version.
  build:
    uses: ./.github/workflows/build.yml
    with:
      verify_tag: ${{ github.event.release.tag_name || github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: esp32s3-otbr-firmware
          path: ./artifacts

      - name: Create/Update GitHub Release with Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.event.release.tag_name || github.ref_name }}

          # Ensure the release exists (tolerate a concurrent run creating it first).
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release for tag: $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --generate-notes || true
          fi

          echo "Uploading assets to release: $TAG_NAME"
          gh release upload "$TAG_NAME" \
            ./artifacts/ota_with_rcp_image \
            ./artifacts/combined.bin \
            ./artifacts/s20_otbr.bin \
            ./artifacts/web_storage.bin \
            ./artifacts/rcp_fw.bin \
            --clobber
